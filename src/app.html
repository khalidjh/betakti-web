<!doctype html>
<html lang="%lang%" dir="%dir%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Safari on iOS puts an "Open / Get the app" bar at the top of every
         page from this. It is the cheapest install prompt that exists, and
         the site had none. -->
    <meta name="apple-itunes-app" content="app-id=1460140608" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Display face (headings, wordmark). Self-hosted, so no third-party
         round-trip; the bold cut is preloaded because nearly every heading is
         semibold or bolder and sits above the fold. -->
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/thmanyah/thmanyah.css" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%sveltekit.assets%/fonts/thmanyah/serif-display/thmanyahserifdisplay-Bold.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/cursive/cursive.css" />
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|; )theme=([^;]+)/);
          var cookie = match ? decodeURIComponent(match[1]) : null;
          var saved = cookie || localStorage.getItem('theme');
          // Default: dark, like the app. Light is an explicit choice.
          var effective;
          if (saved === 'dark') {
            effective = 'dark';
          } else if (saved === 'light') {
            effective = 'light';
          } else if (saved === 'system') {
            effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            effective = 'dark';
          }
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
